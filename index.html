      }
    };

    // ==========================================
    // 3. FUNÇÕES UTILITÁRIAS
    // ==========================================
    
    function saveStats() {
      localStorage.setItem('cronos_stats', JSON.stringify(state.stats));
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function lucideInit() {
      if (window.lucide) window.lucide.createIcons();
    }
    
    function goHome() {
      clearInterval(state.timerInterval);
      clearInterval(state.hintInterval);
      state.view = 'home';
      renderApp();
    }

    // ==========================================
    // 4. LÓGICA DO QUIZ
    // ==========================================

    function startQuiz(mode, isReview = false) {
      state.mode = mode;
      state.view = 'quiz';
      state.currentQuestionIndex = 0;
      state.userAnswers = {};
      state.showFeedback = false;
      state.hintLevel = 0;
      state.hintTimer = 0;
      
      // Configurar perguntas
      if (isReview) {
        state.activeQuestions = questionsData.filter(q => state.lastWrongIds.includes(q.id));
      } else {
        // Reset perguntas (aqui poderia ter shuffle)
        state.activeQuestions = [...questionsData];
      }

      // Configurar Timer
      clearInterval(state.timerInterval);
      if (mode === 'test') {
        state.timeLeft = 600; // 10 mins
        state.timerInterval = setInterval(() => {
          if (state.timeLeft > 0) {
            state.timeLeft--;
            const timerDisplay = document.getElementById('timer-display');
            if (timerDisplay) timerDisplay.innerText = formatTime(state.timeLeft);
            
            const timerContainer = document.getElementById('timer-container');
            if(timerContainer && state.timeLeft < 60) timerContainer.classList.add('text-red-600', 'bg-red-50', 'animate-pulse');
          } else {
            finishQuiz();
          }
        }, 1000);
      } else {
        state.timeLeft = null;
        startHintTimer();
      }
      
      renderApp();
    }

    function startHintTimer() {
      clearInterval(state.hintInterval);
      if (state.mode === 'study' && !state.showFeedback) {
        state.hintInterval = setInterval(() => {
          state.hintTimer++;
          if (state.hintTimer === 30) { state.hintLevel = 1; renderQuiz(); }
          if (state.hintTimer === 60) { state.hintLevel = 2; renderQuiz(); }
          // Atualiza contadores na UI se existirem
          const hintCounters = document.querySelectorAll('.hint-counter');
          hintCounters.forEach(el => {
             const limit = parseInt(el.dataset.limit);
             if(limit > state.hintTimer) el.innerText = `(${limit - state.hintTimer}s)`;
             else el.innerText = '';
          });
        }, 1000);
      }
    }

    function checkAnswer(question, answer) {
      if (!answer) return false;
      if (question.type === 'multiple_choice' || question.type === 'dropdown') {
        const opt = question.options.find(o => o.id === answer);
        return opt ? opt.isCorrect : false;
      }
      if (question.type === 'multiple_select') {
        const correctIds = question.options.filter(o => o.isCorrect).map(o => o.id);
        if (answer.length !== correctIds.length) return false;
        return correctIds.every(id => answer.includes(id));
      }
      if (question.type === 'matching') {
        return question.matchingPairs.every(pair => answer[pair.left] === pair.correctRight);
      }
      if (question.type === 'ordering') {
        return JSON.stringify(answer) === JSON.stringify(question.correctOrder);
      }
      return false;
    }

    function submitAnswer() {
      const q = state.activeQuestions[state.currentQuestionIndex];
      const ans = state.userAnswers[q.id];
      
      if (state.mode === 'study') {
        const isCorrect = checkAnswer(q, ans);
        state.feedbackCorrect = isCorrect;
        state.showFeedback = true;
        clearInterval(state.hintInterval);
        renderQuiz();
      } else {
        nextQuestion();
      }
    }

    function nextQuestion() {
      if (state.currentQuestionIndex < state.activeQuestions.length - 1) {
        state.currentQuestionIndex++;
        state.showFeedback = false;
        state.hintLevel = 0;
        state.hintTimer = 0;
        if(state.mode === 'study') startHintTimer();
        renderQuiz();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      clearInterval(state.timerInterval);
      clearInterval(state.hintInterval);

      let correctCount = 0;
      let sessionScore = 0;
      let wrongIds = [];
      let currentStreak = 0;
      let maxStreak = 0;

      // Calcular Stats
      state.activeQuestions.forEach(q => {
        const ans = state.userAnswers[q.id];
        const isCorrect = checkAnswer(q, ans);
        
        // Topic Stats
        if (!state.stats.topicPerformance[q.topic]) {
          state.stats.topicPerformance[q.topic] = { correct: 0, total: 0 };
        }
        state.stats.topicPerformance[q.topic].total++;

        if (isCorrect) {
          correctCount++;
          sessionScore += q.points;
          state.stats.topicPerformance[q.topic].correct++;
          currentStreak++;
          if (currentStreak > maxStreak) maxStreak = currentStreak;
        } else {
          wrongIds.push(q.id);
          currentStreak = 0;
        }
      });

      state.lastWrongIds = wrongIds;
      state.stats.totalScore += sessionScore;
      state.stats.gamesPlayed++;
      state.stats.history.push({ date: new Date().toLocaleDateString(), score: sessionScore, total: state.activeQuestions.length * 10 });

      // Badges Logic
      const badges = state.stats.badges;
      if (state.activeQuestions.length >= 5 && correctCount >= 5 && !badges.includes('novice')) badges.push('novice');
      if (state.stats.totalScore >= 500 && !badges.includes('expert')) badges.push('expert');
      if (maxStreak >= 5 && !badges.includes('streak')) badges.push('streak');
      if (state.mode === 'test' && wrongIds.length === 0 && state.activeQuestions.length >= 5 && !badges.includes('perfect')) badges.push('perfect');

      saveStats();
      state.view = 'dashboard';
      renderApp();
    }

    // ==========================================
    // 5. RENDERIZAÇÃO (DOM MANIPULATION)
    // ==========================================

    function renderHeader() {
      return `
        <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-stone-200 shadow-sm">
          <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="goHome()">
              <div class="bg-bronze-500 p-1.5 rounded-lg text-white">🏺</div>
              <div>
                <h1 class="font-serif font-bold text-stone-800 leading-tight hidden sm:block">Cronos</h1>
                <p class="text-xs text-stone-500 uppercase tracking-wider font-semibold">História Ibérica</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              ${state.mode === 'test' && state.view === 'quiz' ? `
                <div id="timer-container" class="flex items-center gap-2 font-mono font-bold text-lg px-3 py-1 rounded-lg text-stone-700 bg-stone-100 transition-colors">
                  <i data-lucide="clock" class="w-5 h-5"></i>
                  <span id="timer-display">${formatTime(state.timeLeft)}</span>
                </div>
              ` : ''}
              <button onclick="toggleGuide(true)" class="p-2 text-stone-500 hover:bg-stone-100 rounded-full transition-colors" title="Ajuda">
                <i data-lucide="help-circle" class="w-6 h-6"></i>
              </button>
              ${state.view !== 'home' ? `
                <button onclick="goHome()" class="px-3 py-1 text-sm font-medium text-stone-600 hover:bg-stone-100 rounded-lg">Sair</button>
              ` : ''}
            </div>
          </div>
        </header>
      `;
    }

    function renderHome() {
      const modesHtml = MODES.map(m => `
        <div class="bg-white rounded-2xl shadow-xl hover:shadow-2xl transition-all p-8 flex flex-col items-center text-center border border-stone-100 group">
          <div class="w-16 h-16 bg-stone-100 rounded-full flex items-center justify-center mb-6 text-stone-600 group-hover:bg-bronze-100 group-hover:text-bronze-600 transition-colors">
            <i data-lucide="${m.icon}" class="w-8 h-8"></i>
          </div>
          <h3 class="text-xl font-bold mb-2">${m.name}</h3>
          <p class="text-stone-500 text-sm mb-6 flex-1">${m.desc}</p>
          <button onclick="${m.id === 'dashboard' ? "state.view='dashboard'; renderApp()" : `startQuiz('${m.id}')`}" 
            class="w-full px-4 py-2 bg-bronze-500 hover:bg-bronze-600 text-white rounded-lg font-medium shadow-md shadow-bronze-500/20 transition-all">
            Começar
          </button>
        </div>
      `).join('');

      return `
        <main class="max-w-4xl mx-auto px-4 py-12 animate-fade-in">
          <div class="text-center mb-16 space-y-4">
            <h1 class="text-4xl md:text-6xl font-serif font-bold text-stone-900 mb-4">
              Primeiras Comunidades <br /> <span class="text-bronze-600">da Península Ibérica</span>
            </h1>
            <p class="text-lg text-stone-600 max-w-2xl mx-auto">
              Prepara-te para o teste de História. Explora a vida dos caçadores-recoletores,
              a arte rupestre, e a chegada dos povos mediterrâneos.
            </p>
            <button onclick="toggleGuide(true)" class="text-bronze-600 font-bold underline decoration-bronze-300 hover:text-bronze-800 mt-4 inline-block">
              Como jogar? Ler guia.
            </button>
          </div>
          <div class="grid md:grid-cols-3 gap-6">${modesHtml}</div>
        </main>
      `;
    }

    function renderQuiz() {
      const q = state.activeQuestions[state.currentQuestionIndex];
      const total = state.activeQuestions.length;
      const progress = ((state.currentQuestionIndex + 1) / total) * 100;
      const ans = state.userAnswers[q.id];

      // Input Rendering Logic
      let inputHtml = '';
      
      if (q.type === 'multiple_choice') {
        inputHtml = `<div class="space-y-3">` + q.options.map(opt => {
          const isSelected = ans === opt.id;
          return `
            <button onclick="handleInput('single', '${opt.id}')" ${state.showFeedback ? 'disabled' : ''}
              class="w-full p-4 text-left rounded-lg border-2 transition-all flex items-center gap-3 ${isSelected ? 'border-bronze-500 bg-amber-50 text-stone-900 font-medium' : 'border-stone-200 hover:border-bronze-300 bg-white text-stone-700'}">
              <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${isSelected ? 'border-bronze-500' : 'border-stone-300'}">
                ${isSelected ? '<div class="w-2.5 h-2.5 rounded-full bg-bronze-500"></div>' : ''}
              </div>
              ${opt.text}
            </button>
          `;
        }).join('') + `</div>`;
      } 
      else if (q.type === 'multiple_select') {
        const selected = ans || [];
        inputHtml = `<div class="space-y-3">` + q.options.map(opt => {
          const isSel = selected.includes(opt.id);
          return `
            <button onclick="handleInput('multi', '${opt.id}')" ${state.showFeedback ? 'disabled' : ''}
              class="w-full p-4 text-left rounded-lg border-2 transition-all flex items-center gap-3 ${isSel ? 'border-bronze-500 bg-amber-50 text-stone-900 font-medium' : 'border-stone-200 hover:border-bronze-300 bg-white text-stone-700'}">
              <div class="w-5 h-5 rounded flex items-center justify-center border-2 ${isSel ? 'bg-bronze-500 border-bronze-500 text-white' : 'border-stone-300 bg-white'}">
                ${isSel ? '<i data-lucide="check" class="w-3 h-3"></i>' : ''}
              </div>
              ${opt.text}
            </button>
          `;
        }).join('') + `</div>`;
      }
      else if (q.type === 'dropdown') {
        inputHtml = `
          <div class="mt-4">
            <select onchange="handleInput('single', this.value)" ${state.showFeedback ? 'disabled' : ''}
              class="w-full p-3 border-2 border-stone-300 rounded-lg text-lg focus:border-bronze-500 outline-none bg-white">
              <option value="" disabled ${!ans ? 'selected' : ''}>Selecione uma opção...</option>
              ${q.options.map(opt => `<option value="${opt.id}" ${ans === opt.id ? 'selected' : ''}>${opt.text}</option>`).join('')}
            </select>
          </div>
        `;
      }
      else if (q.type === 'matching') {
        const matches = ans || {};
        inputHtml = `<div class="space-y-4">` + q.matchingPairs.map(pair => `
          <div class="bg-white p-4 rounded-lg border border-stone-200 shadow-sm flex flex-col sm:flex-row items-center gap-4 justify-between">
            <div class="font-semibold text-stone-800 flex-1">${pair.left}</div>
            <i data-lucide="arrow-right" class="text-stone-400 hidden sm:block"></i>
            <select onchange="handleInput('matching', {left: '${pair.left}', right: this.value})" ${state.showFeedback ? 'disabled' : ''}
              class="flex-1 p-2 border border-stone-300 rounded bg-stone-50">
              <option value="" disabled ${!matches[pair.left] ? 'selected' : ''}>Selecionar...</option>
              ${pair.rightOptions.map(opt => `<option value="${opt}" ${matches[pair.left] === opt ? 'selected' : ''}>${opt}</option>`).join('')}
            </select>
          </div>
        `).join('') + `</div>`;
      }
      else if (q.type === 'ordering') {
        const currentOrder = ans || [];
        const remaining = q.options.filter(o => !currentOrder.includes(o.id));
        inputHtml = `
          <div class="space-y-4">
            <div class="bg-stone-100 p-4 rounded-lg min-h-[100px] border-2 border-dashed border-stone-300">
              <p class="text-xs text-stone-500 mb-2 font-bold uppercase">Sua Ordem:</p>
              ${currentOrder.length === 0 ? '<p class="text-stone-400 italic text-sm">Clique nas opções abaixo para ordenar</p>' : ''}
              <div class="space-y-2">
                ${currentOrder.map((id, idx) => {
                  const opt = q.options.find(o => o.id === id);
                  return `
                    <div class="bg-white p-3 rounded shadow-sm border border-stone-200 flex justify-between items-center cursor-pointer" 
                         onclick="${!state.showFeedback ? `handleInput('ordering_remove', '${id}')` : ''}">
                      <div class="flex items-center">
                        <span class="font-bold text-bronze-600 mr-3">${idx + 1}.</span>
                        <span>${opt.text}</span>
                      </div>
                      ${!state.showFeedback ? '<i data-lucide="x" class="w-4 h-4 text-red-500"></i>' : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            <div class="grid grid-cols-1 gap-2">
              ${remaining.map(opt => `
                <button onclick="handleInput('ordering_add', '${opt.id}')" ${state.showFeedback ? 'disabled' : ''}
                  class="p-3 bg-white border border-stone-200 rounded hover:bg-stone-50 text-left w-full flex justify-between">
                  ${opt.text} <i data-lucide="plus" class="w-4 h-4 text-stone-400"></i>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      // Hint UI
      let hintsHtml = '';
      if (state.mode === 'study' && !state.showFeedback) {
        hintsHtml = `
          <div class="mb-6 flex gap-2">
            <div class="text-xs px-3 py-1 rounded-full flex items-center gap-1 transition-colors ${state.hintLevel >= 1 ? 'bg-amber-100 text-amber-800' : 'bg-stone-100 text-stone-400'}">
              <i data-lucide="lightbulb" class="w-3 h-3"></i> Dica 1 <span class="hint-counter" data-limit="30">${state.hintLevel < 1 ? `(${30 - state.hintTimer}s)` : ''}</span>
            </div>
            <div class="text-xs px-3 py-1 rounded-full flex items-center gap-1 transition-colors ${state.hintLevel >= 2 ? 'bg-amber-100 text-amber-800' : 'bg-stone-100 text-stone-400'}">
              <i data-lucide="lightbulb" class="w-3 h-3"></i> Dica 2 <span class="hint-counter" data-limit="60">${state.hintLevel < 2 && state.hintLevel >= 1 ? `(${60 - state.hintTimer}s)` : ''}</span>
            </div>
          </div>
          ${state.hintLevel >= 1 ? `
            <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 mb-6 text-sm text-stone-700 animate-fade-in">
              <strong class="text-amber-700 block mb-1">💡 Dica:</strong>
              ${state.hintLevel === 1 ? q.hintLevel1 : q.hintLevel2}
            </div>
          ` : ''}
        `;
      }

      // Feedback UI
      let feedbackHtml = '';
      if (state.showFeedback) {
        feedbackHtml = `
          <div class="mt-6 p-6 rounded-xl border-l-4 shadow-lg animate-fade-in ${state.feedbackCorrect ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}">
            <div class="flex items-start gap-4">
              <div class="mt-1">
                <i data-lucide="${state.feedbackCorrect ? 'check-circle' : 'x-circle'}" class="w-8 h-8 ${state.feedbackCorrect ? 'text-green-600' : 'text-red-600'}"></i>
              </div>
              <div class="flex-1">
                <h3 class="text-lg font-bold mb-2 ${state.feedbackCorrect ? 'text-green-800' : 'text-red-800'}">
                  ${state.feedbackCorrect ? 'Correto! Muito bem!' : 'Incorreto.'}
                </h3>
                <div class="bg-white/60 p-4 rounded-lg mt-2">
                  <div class="flex items-center gap-2 mb-2 text-stone-700 font-semibold">
                    <i data-lucide="lightbulb" class="w-5 h-5 text-amber-500"></i> <span>Explicação:</span>
                  </div>
                  <p class="text-stone-700 leading-relaxed">${q.explanation}</p>
                </div>
                <button onclick="nextQuestion()" class="mt-4 px-6 py-2 rounded-lg font-bold text-white shadow-md transition-transform active:scale-95 ${state.feedbackCorrect ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}">
                  ${state.currentQuestionIndex === total - 1 ? 'Ver Resultados' : 'Próxima Questão →'}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      const content = `
        <div class="max-w-3xl mx-auto px-4 py-8 animate-fade-in">
          <div class="flex justify-between items-end mb-4">
            <span class="text-xs font-bold text-bronze-600 tracking-wider uppercase bg-bronze-50 px-2 py-1 rounded">${q.topic}</span>
            <span class="text-sm font-medium text-stone-500">Questão ${state.currentQuestionIndex + 1} de ${total}</span>
          </div>
          <div class="w-full h-3 bg-stone-200 rounded-full overflow-hidden mb-6">
            <div class="h-full bg-bronze-500 transition-all duration-500 ease-out" style="width: ${progress}%"></div>
          </div>
          <div class="bg-white rounded-2xl shadow-xl border border-stone-200 overflow-hidden">
             ${q.image ? `<div class="w-full h-48 bg-stone-100 overflow-hidden relative"><img src="${q.image}" class="w-full h-full object-cover"></div>` : ''}
             <div class="p-6 md:p-8">
               <h2 class="text-xl md:text-2xl font-serif font-bold text-stone-800 mb-6 leading-relaxed">${q.prompt}</h2>
               ${hintsHtml}
               <div class="animate-slide-up">${inputHtml}</div>
               ${feedbackHtml}
             </div>
          </div>
          ${!state.showFeedback ? `
            <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-stone-200 p-4 shadow-lg z-30">
              <div class="max-w-3xl mx-auto flex justify-between items-center">
                <button onclick="state.currentQuestionIndex--; renderQuiz()" ${state.currentQuestionIndex === 0 ? 'disabled' : ''} class="px-4 py-2 text-stone-600 hover:bg-stone-100 rounded-lg disabled:opacity-50">Anterior</button>
                <button onclick="submitAnswer()" ${!ans ? 'disabled' : ''} class="px-6 py-2 bg-bronze-500 hover:bg-bronze-600 text-white rounded-lg font-medium shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                   ${state.mode === 'study' ? 'Verificar' : (state.currentQuestionIndex === total - 1 ? 'Terminar' : 'Próxima')}
                </button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
      
      document.getElementById('app').innerHTML = renderHeader() + content;
      lucideInit();
    }

    function handleInput(type, value) {
      if (state.showFeedback) return;
      const qId = state.activeQuestions[state.currentQuestionIndex].id;
      
      if (type === 'single') {
        state.userAnswers[qId] = value;
      } else if (type === 'multi') {
        const current = state.userAnswers[qId] || [];
        if (current.includes(value)) state.userAnswers[qId] = current.filter(id => id !== value);
        else state.userAnswers[qId] = [...current, value];
      } else if (type === 'matching') {
        const current = state.userAnswers[qId] || {};
        state.userAnswers[qId] = { ...current, [value.left]: value.right };
      } else if (type === 'ordering_add') {
        const current = state.userAnswers[qId] || [];
        state.userAnswers[qId] = [...current, value];
      } else if (type === 'ordering_remove') {
        const current = state.userAnswers[qId] || [];
        state.userAnswers[qId] = current.filter(id => id !== value);
      }
      
      renderQuiz();
    }

    function renderDashboard() {
      // Logic for chart data
      const topicStats = Object.entries(state.stats.topicPerformance).map(([name, s]) => ({
        name: name.replace('Comunidades ', '').replace('Povos ', ''),
        pct: s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0,
        total: s.total
      }));

      // Badges
      const badgesHtml = BADGES.map(b => {
        const earned = state.stats.badges.includes(b.id);
        return `
          <div class="flex flex-col items-center p-4 rounded-xl border-2 transition-all group relative ${earned ? 'bg-amber-50 border-amber-400 shadow-md opacity-100' : 'bg-stone-50 border-stone-200 grayscale opacity-60'}">
            <div class="text-4xl mb-2">${b.icon}</div>
            <span class="font-bold text-center text-sm text-stone-800">${b.name}</span>
            ${earned ? '<span class="text-xs text-amber-600 font-bold mt-1">Conquistado!</span>' : ''}
            <div class="absolute opacity-0 group-hover:opacity-100 bottom-full mb-2 bg-stone-800 text-white text-xs p-2 rounded shadow-lg pointer-events-none w-40 text-center z-10 transition-opacity">
               ${b.description}
            </div>
          </div>
        `;
      }).join('');

      // CSS Chart
      const chartHtml = topicStats.length > 0 ? `
        <div class="space-y-4">
          ${topicStats.map(stat => `
            <div>
              <div class="flex justify-between text-xs font-bold text-stone-600 mb-1">
                <span>${stat.name}</span>
                <span>${stat.pct}%</span>
              </div>
              <div class="h-4 bg-stone-100 rounded-full overflow-hidden">
                <div class="h-full rounded-full ${stat.pct > 75 ? 'bg-green-500' : stat.pct > 40 ? 'bg-amber-500' : 'bg-red-500'}" style="width: ${stat.pct}%"></div>
              </div>
            </div>
          `).join('')}
        </div>
      ` : '<p class="text-stone-400 text-center py-8">Completa um quiz para ver dados.</p>';

      const content = `
        <main class="max-w-5xl mx-auto px-4 py-8 animate-fade-in">
          <div class="flex justify-between items-center mb-6">
            <button onclick="goHome()" class="flex items-center text-stone-600 hover:text-bronze-600 font-medium">
              <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Voltar ao Menu
            </button>
            ${state.lastWrongIds.length > 0 ? `
              <button onclick="startQuiz('study', true)" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg shadow-md flex items-center">
                <i data-lucide="refresh-cw" class="w-4 h-4 mr-2"></i> Rever ${state.lastWrongIds.length} Erros
              </button>
            ` : ''}
          </div>

          <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
              <h3 class="text-stone-500 text-sm font-bold uppercase mb-2">Pontuação Total</h3>
              <p class="text-4xl font-serif font-bold text-bronze-600">${state.stats.totalScore}</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
              <h3 class="text-stone-500 text-sm font-bold uppercase mb-2">Jogos Completos</h3>
              <p class="text-4xl font-serif font-bold text-stone-800">${state.stats.gamesPlayed}</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
              <h3 class="text-stone-500 text-sm font-bold uppercase mb-2">Badges</h3>
              <p class="text-4xl font-serif font-bold text-amber-500">${state.stats.badges.length}/${BADGES.length}</p>
            </div>
          </div>

          <div class="grid md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
              <h3 class="font-serif font-bold text-xl mb-6">Desempenho por Tema</h3>
              ${chartHtml}
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
              <h3 class="font-serif font-bold text-xl mb-6">Conquistas</h3>
              <div class="grid grid-cols-2 gap-4">${badgesHtml}</div>
            </div>
          </div>
        </main>
      `;

      document.getElementById('app').innerHTML = renderHeader() + content;
      lucideInit();
    }

    function renderGuide() {
      if (!state.isGuideOpen) return '';
      return `
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
          <div class="absolute inset-0 bg-stone-900/50 backdrop-blur-sm" onclick="toggleGuide(false)"></div>
          <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto animate-fade-in border border-stone-200">
            <div class="sticky top-0 bg-white border-b border-stone-100 p-4 flex justify-between items-center z-10">
              <h2 class="text-xl font-serif font-bold text-stone-800 flex items-center gap-2">
                <i data-lucide="help-circle" class="text-bronze-600"></i> Guia do Utilizador
              </h2>
              <button onclick="toggleGuide(false)"><i data-lucide="x" class="w-6 h-6 text-stone-500"></i></button>
            </div>
            <div class="p-6 space-y-6">
              <section>
                <h3 class="font-bold text-stone-800 mb-2 flex items-center gap-2"><i data-lucide="book-open" class="w-4 h-4 text-bronze-500"></i> Modos</h3>
                <div class="text-sm text-stone-600 space-y-2">
                  <p><strong>Modo Estudo:</strong> Sem tempo, feedback imediato e dicas automáticas após 30s/60s.</p>
                  <p><strong>Modo Teste:</strong> 10 minutos para responder a tudo. Resultados apenas no fim.</p>
                </div>
              </section>
              <section>
                <h3 class="font-bold text-stone-800 mb-2 flex items-center gap-2"><i data-lucide="bar-chart-3" class="w-4 h-4 text-blue-500"></i> Progresso</h3>
                <p class="text-sm text-stone-600">Acompanha a tua evolução no gráfico de barras, que mostra a percentagem de acerto por cada tema histórico.</p>
              </section>
            </div>
            <div class="p-4 border-t border-stone-100 flex justify-end">
              <button onclick="toggleGuide(false)" class="px-4 py-2 bg-bronze-500 text-white rounded-lg">Entendido</button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleGuide(isOpen) {
      state.isGuideOpen = isOpen;
      // Re-render apenas o guide overlay se possível, mas aqui renderApp é mais simples
      const guideContainer = document.getElementById('guide-container');
      if (guideContainer) {
        guideContainer.innerHTML = renderGuide();
        lucideInit();
      } else {
        renderApp();
      }
    }

    // ==========================================
    // 6. LOOP PRINCIPAL
    // ==========================================

    function renderApp() {
      const app = document.getElementById('app');
      // Renderizar o conteúdo base
      if (state.view === 'home') app.innerHTML = renderHeader() + renderHome();
      else if (state.view === 'quiz') renderQuiz(); // quiz renderiza tudo
      else if (state.view === 'dashboard') renderDashboard(); // dashboard renderiza tudo
      
      // Injetar o Modal do Guia (sempre presente no DOM mas condicionalmente visível)
      let guideDiv = document.getElementById('guide-container');
      if (!guideDiv) {
        guideDiv = document.createElement('div');
        guideDiv.id = 'guide-container';
        document.body.appendChild(guideDiv);
      }
      guideDiv.innerHTML = renderGuide();
      
      lucideInit();
    }

    // Inicialização
    renderApp();
    
  </script>
</body>
</html>
