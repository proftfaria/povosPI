    const Quiz = ({ questions: initialQuestions, mode, onComplete }) => {

      const [showSummary, setShowSummary] = useState(false);
      const [streak, setStreak] = useState(0);

      const q = currentBatch[currIdx];

      useEffect(() => {
        let int;
        if (mode !== 'test' && !showFB && !showSummary) {
          int = setInterval(() => {
            setHintT(p => {
              const next = p + 1;
              if (next === 30) setHintLvl(1);
              if (next === 60) setHintLvl(2);
              return next;
            });
          }, 1000);
        }
        return () => clearInterval(int);
      }, [mode, showFB, currIdx, showSummary]);

      const isCorrect = useCallback((q, a) => {
        if (!a) return false;
        if (q.type === 'multiple_choice' || q.type === 'dropdown') return q.options.find(o => o.id === a)?.isCorrect;
        if (q.type === 'multiple_select') {
          const cIds = q.options.filter(o => o.isCorrect).map(o => o.id);
          return Array.isArray(a) && a.length === cIds.length && cIds.every(id => a.includes(id));
        }
        if (q.type === 'matching') return q.matchingPairs.every(p => a[p.left] === p.correctRight);
        if (q.type === 'ordering') return JSON.stringify(a) === JSON.stringify(q.correctOrder);
        return false;
      }, []);

      const handleNext = () => {
        if (mode !== 'test' && !showFB) { 
          setShowFB(true); 
          if (isCorrect(q, ans[q.id])) {
            setStreak(prev => prev + 1);
          } else {
            setStreak(0);
          }
          return; 
        }
        
        if (currIdx < currentBatch.length - 1) {
          setCurrIdx(currIdx + 1);
          setShowFB(!!ans[currentBatch[currIdx + 1].id] && mode !== 'test');
          setHintLvl(0);
          setHintT(0);
        } else {
          const wrongQs = currentBatch.filter(quest => !isCorrect(quest, ans[quest.id]));
          
          if (mode === 'test') {
            const finalScore = currentBatch.reduce((acc, quest) => acc + (isCorrect(quest, ans[quest.id]) ? quest.points : 0), 0);
            const correctIds = currentBatch.filter(quest => isCorrect(quest, ans[quest.id])).map(quest => quest.id);
            const isPerfect = wrongQs.length === 0;
            onComplete({ correct: currentBatch.length - wrongQs.length, total: currentBatch.length, score: finalScore, answers: ans, correctIds, isPerfect, streak });
          } else {
            if (wrongQs.length > 0) {
              setShowSummary(true);
            } else {
              const finalScore = allSessionQuestions.reduce((acc, quest) => acc + (isCorrect(quest, ans[quest.id]) ? quest.points : 0), 0);
              const correctIds = allSessionQuestions.map(quest => quest.id);
              onComplete({ correct: allSessionQuestions.length, total: allSessionQuestions.length, score: finalScore, answers: ans, correctIds, isPerfect: true, streak });
            }
          }
        }
      };

      const handlePrev = () => {
        if (currIdx > 0) {
          setCurrIdx(currIdx - 1);
          setShowFB(mode !== 'test'); 
        }
      };

      const startCorrection = () => {
        const wrongQs = currentBatch.filter(quest => !isCorrect(quest, ans[quest.id]));
        setCurrentBatch(wrongQs);
        setCurrIdx(0);
        setShowFB(false);
        setShowSummary(false);
        setHintLvl(0);
        setHintT(0);
      };

      if (showSummary) {
        const currentBatchWrongCount = currentBatch.filter(quest => !isCorrect(quest, ans[quest.id])).length;
        return (
          <div className="max-w-4xl mx-auto px-6 py-16 animate-fade-in text-center">
            <div className="bg-white p-12 rounded-[3rem] border border-stone-200 shadow-2xl">
              <h2 className="text-4xl font-serif font-bold text-stone-900 mb-6">Resumo da Jornada</h2>
              <div className="grid grid-cols-2 gap-8 mb-10">
                <div className="bg-green-50 p-6 rounded-3xl border border-green-100">
                  <p className="text-sm font-bold text-green-600 uppercase">Acertos</p>
                  <p className="text-4xl font-serif font-bold text-green-800">{currentBatch.length - currentBatchWrongCount}</p>
                </div>
                <div className="bg-red-50 p-6 rounded-3xl border border-red-100">
                  <p className="text-sm font-bold text-red-600 uppercase">Erros a Corrigir</p>
                  <p className="text-4xl font-serif font-bold text-red-800">{currentBatchWrongCount}</p>
                </div>
              </div>
              <p className="text-stone-500 mb-10 font-medium">Concluíste este lote. Ainda tens {currentBatchWrongCount} questões para dominar.</p>
              <div className="flex gap-4">
                <button onClick={() => {
                  const finalScore = allSessionQuestions.reduce((acc, quest) => acc + (isCorrect(quest, ans[quest.id]) ? quest.points : 0), 0);
                  const correctIds = allSessionQuestions.filter(quest => isCorrect(quest, ans[quest.id])).map(quest => quest.id);
                  onComplete({ correct: allSessionQuestions.length - currentBatchWrongCount, total: allSessionQuestions.length, score: finalScore, answers: ans, correctIds, isPerfect: false, streak });
                }} className="flex-1 bg-stone-100 hover:bg-stone-200 py-5 rounded-2xl font-bold text-stone-600">Sair Agora</button>
                <button onClick={startCorrection} className="flex-[2] bg-amber-600 hover:bg-amber-700 text-white py-5 rounded-2xl font-bold shadow-lg">Corrigir Erros</button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto px-4 py-8 animate-fade-in custom-scrollbar">
          <div className="mb-8 flex justify-between items-end">
            <div className="flex-1">
              <span className="text-xs font-bold text-amber-600 uppercase tracking-widest bg-amber-50 px-2 py-1 rounded">{q.topic}</span>
              <h2 className="text-2xl font-serif font-bold text-stone-900 mt-3 leading-tight">{q.prompt}</h2>
            </div>
            <div className="ml-4 bg-stone-100 px-3 py-1 rounded-full text-stone-500 font-bold text-sm whitespace-nowrap">{currIdx + 1} / {currentBatch.length}</div>
          </div>
          
          {q.image && (
            <div className="mb-6 flex justify-center">
              <img src={q.image} alt="Questão" className="max-h-64 rounded-xl border-2 border-stone-200 shadow-md object-contain bg-white p-2" />

          {mode !== 'test' && !showFB && (
            <div className="mb-6 flex gap-4">
              <div className={`text-xs px-3 py-1.5 rounded-full border transition-all ${hintLvl >= 1 ? 'bg-amber-100 text-amber-700 border-amber-300 shadow-sm' : 'bg-stone-100 text-stone-400 border-stone-200'}`}>Dica 1 {hintLvl < 1 && `(${30 - hintT}s)`}</div>
              <div className={`text-xs px-3 py-1.5 rounded-full border transition-all ${hintLvl >= 2 ? 'bg-amber-100 text-amber-700 border-amber-300 shadow-sm' : 'bg-stone-100 text-stone-400 border-stone-200'}`}>Dica 2 {hintLvl < 2 && `(${60 - hintT}s)`}</div>
            </div>
          )}

          {hintLvl >= 1 && !showFB && <div className="mb-8 bg-amber-50 border-l-4 border-amber-400 p-5 rounded-r-xl text-stone-700 animate-slide-up shadow-sm font-medium">💡 {hintLvl === 1 ? q.hintLevel1 : q.hintLevel2}</div>}

          <div className="mb-10 space-y-4">
            {q.type === 'multiple_choice' && q.options.map(o => (
              <button key={o.id} disabled={showFB && mode === 'test'} onClick={() => setAns(p => ({...p, [q.id]: o.id}))} 
                className={`w-full p-5 text-left border-2 rounded-2xl transition-all shadow-sm ${ans[q.id] === o.id ? 'border-amber-600 bg-amber-50' : 'border-stone-200 hover:border-amber-200 bg-white'} ${showFB && o.isCorrect ? 'border-green-500 bg-green-50' : ''}`}>
                <div className="flex items-center gap-4">
                  <span className={`w-8 h-8 rounded-full flex items-center justify-center font-bold ${ans[q.id] === o.id ? 'bg-amber-600 text-white' : 'bg-stone-100 text-stone-400'}`}>{o.id.toUpperCase()}</span>
                  <span className="text-lg">{o.text}</span>
                </div>
              </button>
            ))}
            
            {q.type === 'multiple_select' && q.options.map(o => {
              const selected = ans[q.id] || [];
              const isSel = selected.includes(o.id);
              return (
                <button key={o.id} disabled={showFB && mode === 'test'} onClick={() => {
                  const next = isSel ? selected.filter(i => i !== o.id) : [...selected, o.id];
                  setAns(p => ({...p, [q.id]: next}));
                }} className={`w-full p-5 text-left border-2 rounded-2xl flex justify-between items-center transition-all ${isSel ? 'border-amber-600 bg-amber-50' : 'border-stone-200 bg-white'}`}>
                  <span className="text-lg">{o.text}</span>
                  <div className={`w-6 h-6 border-2 rounded flex items-center justify-center ${isSel ? 'bg-amber-600 border-amber-600 text-white' : 'border-stone-300'}`}>{isSel && '✓'}</div>
                </button>
              );
            })}

            {q.type === 'matching' && q.matchingPairs.map(p => (
              <div key={p.left} className="flex flex-col sm:flex-row gap-4 items-center bg-white p-4 rounded-2xl border-2 border-stone-100 shadow-sm">
                <div className="flex-1 font-bold text-stone-700 text-lg">{p.left}</div>
                <select disabled={showFB && mode === 'test'} value={(ans[q.id] || {})[p.left] || ''} 
                  onChange={e => setAns(p_ => ({...p_, [q.id]: {...(p_[q.id] || {}), [p.left]: e.target.value}}))} 
                  className="flex-1 p-3 bg-stone-50 border border-stone-200 rounded-xl outline-none focus:ring-2 focus:ring-amber-500">
                  <option value="">Selecionar...</option>
                  {p.rightOptions.map(ro => <option key={ro} value={ro}>{ro}</option>)}
                </select>
              </div>
            ))}

            {q.type === 'ordering' && (
              <div className="space-y-6">
                <div className="bg-stone-100 p-6 rounded-2xl border-2 border-dashed border-stone-300 min-h-[80px] flex flex-wrap gap-3 items-center">
                  {(ans[q.id] || []).map((id, i) => (
                    <div key={id} onClick={() => !(showFB && mode === 'test') && setAns(p_ => ({...p_, [q.id]: (p_[q.id] || []).filter(item => item !== id)}))} className="bg-amber-600 text-white px-4 py-2 rounded-xl cursor-pointer shadow-md transform hover:scale-105 transition-transform flex items-center gap-2">
                      <span className="bg-white/20 px-2 rounded font-bold">{i+1}</span>
                      {q.options.find(o => o.id === id)?.text}
                    </div>
                  ))}
                  {(ans[q.id] || []).length === 0 && <span className="text-stone-400 italic">Clica nas opções abaixo para ordenar...</span>}
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {q.options.filter(o => !(ans[q.id] || []).includes(o.id)).map(o => (
                    <button key={o.id} disabled={showFB && mode === 'test'} onClick={() => setAns(p_ => ({...p_, [q.id]: [...(p_ [q.id] || []), o.id]}))} className="p-4 border-2 border-stone-200 rounded-xl bg-white hover:border-amber-400 transition-colors text-stone-600 font-medium">{o.text}</button>
                  ))}
                </div>
              </div>
            )}

            {q.type === 'dropdown' && (
              <div className="relative">
                <select disabled={showFB && mode === 'test'} value={ans[q.id] || ''} onChange={e => setAns(p => ({...p, [q.id]: e.target.value}))} 
                  className="w-full p-5 border-2 rounded-2xl bg-white outline-none focus:ring-2 focus:ring-amber-500 appearance-none text-lg">
                  <option value="">Escolhe a resposta correta...</option>
                  {q.options.map(o => <option key={o.id} value={o.id}>{o.text}</option>)}
                </select>
                <div className="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-stone-400">▼</div>
              </div>
            )}
          </div>

          {showFB && (
            <div className={`mb-10 p-8 rounded-3xl border-l-8 animate-slide-up shadow-xl ${isCorrect(q, ans[q.id]) ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`}>
              <h3 className="text-2xl font-bold mb-3 flex items-center gap-2">
                {isCorrect(q, ans[q.id]) ? '✨ Resposta Correta!' : '📜 Reflexão Histórica'}
              </h3>
              <p className="text-stone-700 text-lg leading-relaxed">{q.explanation}</p>
            </div>
          )}

          <div className="flex justify-between items-center gap-4">
            <button 
              onClick={handlePrev} 
              disabled={currIdx === 0} 
              className={`px-8 py-4 rounded-2xl font-bold text-lg border-2 transition-all ${currIdx === 0 ? 'opacity-0 pointer-events-none' : 'border-stone-200 text-stone-500 hover:bg-stone-100'}`}
            >
              Anterior
            </button>
            <button onClick={handleNext} disabled={!ans[q.id] && mode === 'test'} className="bg-amber-600 hover:bg-amber-700 text-white px-10 py-4 rounded-2xl font-bold text-lg shadow-lg hover:shadow-amber-200 transition-all disabled:opacity-50 active:scale-95">
              {showFB ? (currIdx === currentBatch.length - 1 ? 'Concluir' : 'Próxima') : (mode === 'test' ? 'Submeter' : 'Verificar')}
            </button>
          </div>
        </div>
      );
    };

    const UserGuide = ({ onClose }) => (
      <div className="fixed inset-0 z-[100] bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-6">
        <div className="bg-white max-w-2xl w-full rounded-[2.5rem] shadow-2xl overflow-hidden animate-slide-up flex flex-col max-h-[90vh]">
          <div className="bg-amber-600 p-8 text-white relative">
            <h2 className="text-3xl font-serif font-bold">Guia do Utilizador 📖</h2>
            <p className="text-amber-100 mt-2">Descobre como navegar nas crónicas do Cronos.</p>
            <button onClick={onClose} className="absolute top-6 right-6 w-10 h-10 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center font-bold transition-all">✕</button>
          </div>
          <div className="p-8 overflow-y-auto custom-scrollbar space-y-8">
            <section>
              <h3 className="text-lg font-bold text-amber-700 mb-2 uppercase tracking-widest text-xs">Modos de Jogo</h3>
              <div className="space-y-4">
                <div className="flex gap-4">
                  <span className="text-2xl">📖</span>
                  <div>
                    <p className="font-bold text-stone-800">Modo Estudo</p>
                    <p className="text-sm text-stone-500">Pratica as 45 questões. Tens dicas aos 30 e 60 segundos. Podes navegar livremente e corrigir erros no final.</p>
                  </div>
                </div>
                <div className="flex gap-4">
                  <span className="text-2xl">⏱️</span>
                  <div>
                    <p className="font-bold text-stone-800">Modo Teste</p>
                    <p className="text-sm text-stone-500">Um desafio real: 20 questões aleatórias e 10 minutos no cronómetro. Sem dicas!</p>
                  </div>
                </div>
              </div>
            </section>
            
            <section>
              <h3 className="text-lg font-bold text-amber-700 mb-2 uppercase tracking-widest text-xs">Progresso Guardado</h3>
              <p className="text-sm text-stone-600 leading-relaxed">Não te preocupes em perder os teus pontos! O Cronos guarda automaticamente o teu progresso, pontuações e medalhas neste dispositivo. Podes fechar a página e voltar mais tarde que a tua história continua.</p>
            </section>

            <section>
              <h3 className="text-lg font-bold text-amber-700 mb-4 uppercase tracking-widest text-xs">Medalhas e Conquistas</h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="flex items-center gap-3 p-3 bg-stone-50 rounded-xl border border-stone-100">
                  <span className="text-2xl">🏺</span>
                  <div>
                    <p className="font-bold text-xs uppercase text-amber-800">Arqueólogo Iniciante</p>
                    <p className="text-[10px] text-stone-500">Completa 5 questões corretamente.</p>
                  </div>
                </div>
                <div className="flex items-center gap-3 p-3 bg-stone-50 rounded-xl border border-stone-100">
                  <span className="text-2xl">📜</span>
                  <div>
                    <p className="font-bold text-xs uppercase text-amber-800">Historiador Expert</p>
                    <p className="text-[10px] text-stone-500">Acumula mais de 500 pontos totais.</p>
                  </div>
                </div>
                <div className="flex items-center gap-3 p-3 bg-stone-50 rounded-xl border border-stone-100">
                  <span className="text-2xl">🎯</span>
                  <div>
                    <p className="font-bold text-xs uppercase text-amber-800">Perfeccionista</p>
                    <p className="text-[10px] text-stone-500">Acerta 100% num modo de teste.</p>
                  </div>
                </div>
                <div className="flex items-center gap-3 p-3 bg-stone-50 rounded-xl border border-stone-100">
                  <span className="text-2xl">🔥</span>
                  <div>
                    <p className="font-bold text-xs uppercase text-amber-800">Em Chamas</p>
                    <p className="text-[10px] text-stone-500">Acerta 5 questões seguidas.</p>
                  </div>
                </div>
              </div>
            </section>

            <section>
              <h3 className="text-lg font-bold text-amber-700 mb-2 uppercase tracking-widest text-xs">Sistema de Dicas</h3>
              <p className="text-sm text-stone-600 leading-relaxed">No modo Estudo, se tiveres dificuldade, aguarda. A <strong>Dica 1</strong> aparece aos 30s e a <strong>Dica 2</strong> aos 60s para te orientar.</p>
            </section>
          </div>
          <div className="p-8 border-t border-stone-100 bg-stone-50 flex justify-end">
            <button onClick={onClose} className="bg-amber-600 hover:bg-amber-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition-all">Começar a Aprender</button>
          </div>
        </div>
      </div>
    );

    const App = () => {
      const [view, setView] = useState('HOME');
      // Atualizado para cronos_v8_stats para garantir persistência limpa com novos badges
      const [stats, setStats] = useState(() => {
        const saved = localStorage.getItem('cronos_v8_stats');
        return saved ? JSON.parse(saved) : { totalScore: 0, gamesPlayed: 0, badges: [], history: [], topicPerformance: {} };
      });
      const [showGuide, setShowGuide] = useState(false);

      const [testTime, setTestTime] = useState(600);
      const [activeQuestions, setActiveQuestions] = useState([]);
      const [selectedTopics, setSelectedTopics] = useState([]);

      useEffect(() => { localStorage.setItem('cronos_v8_stats', JSON.stringify(stats)); }, [stats]);

      useEffect(() => {
        let timer;
        if (view === 'TEST' && testTime > 0) {
          timer = setInterval(() => setTestTime(p => p - 1), 1000);
        } else if (testTime === 0 && view === 'TEST') {
          setView('DASHBOARD');
        }
        return () => clearInterval(timer);
      }, [view, testTime]);

      const startMode = (mode) => {
        if (mode === 'STUDY') {
          setActiveQuestions([...QUESTIONS_DATA].sort(() => Math.random() - 0.5));
        } else if (mode === 'TEST') {
          setActiveQuestions([...QUESTIONS_DATA].sort(() => Math.random() - 0.5).slice(0, 20));
          setTestTime(600);
        }
        setView(mode);
      };

      const handleQuizComplete = (results) => {
        setStats(prev => {
          const next = { ...prev };
          next.totalScore = (prev.totalScore || 0) + results.score;
          next.gamesPlayed = (prev.gamesPlayed || 0) + 1;
          next.history.push({ date: new Date().toLocaleDateString(), score: results.score, total: results.total });
          
          results.correctIds.forEach(cid => {
            const q = QUESTIONS_DATA.find(qu => qu.id === cid);
            if (q) {
              if (!next.topicPerformance[q.topic]) next.topicPerformance[q.topic] = { correct: 0, total: 0 };
              next.topicPerformance[q.topic].total += 1;
              next.topicPerformance[q.topic].correct += 1;
            }
          });

          // Lógica de Badges Atualizada
          const earnedBadges = [...next.badges];
          if (results.correct >= 5 && !earnedBadges.includes('novice')) earnedBadges.push('novice');
          if (next.totalScore >= 500 && !earnedBadges.includes('expert')) earnedBadges.push('expert');
          if (results.isPerfect && view === 'TEST' && !earnedBadges.includes('perfect')) earnedBadges.push('perfect');
          if (results.streak >= 5 && !earnedBadges.includes('streak')) earnedBadges.push('streak');
          next.badges = earnedBadges;

          return next;
        });
        setView('DASHBOARD');
      };

      const BadgeIcon = ({ id, earned }) => {
        const b = BADGES_CONFIG.find(bc => bc.id === id);
        return (
          <div className={`p-6 rounded-[2rem] border-2 flex flex-col items-center gap-3 transition-all relative group ${earned ? 'bg-amber-50 border-amber-200 shadow-sm' : 'bg-stone-50 border-stone-100 grayscale opacity-40'}`}>
            <span className="text-5xl">{b.icon}</span>
            <div className="text-center">
              <span className="text-[10px] font-bold uppercase tracking-widest text-stone-900 block">{b.name}</span>
            </div>
            {earned && (
              <div className="absolute inset-0 bg-stone-900/90 rounded-[1.9rem] opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center p-4 text-white text-center">
                <p className="text-xs font-bold mb-1">{b.name}</p>
                <p className="text-[10px] opacity-80">{b.description}</p>
              </div>
            )}
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-stone-50 pb-24">
          {showGuide && <UserGuide onClose={() => setShowGuide(false)} />}
          
          <header className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-stone-200 px-6 py-4 shadow-sm flex justify-between items-center">
            <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setView('HOME')}>
              <div className="bg-amber-600 p-2.5 rounded-xl text-white shadow-lg group-hover:bg-amber-700 transition-colors">⏳</div>
              <div>
                <h1 className="font-serif font-bold text-2xl text-stone-900 leading-none">Cronos</h1>
                <p className="text-[10px] uppercase tracking-widest text-stone-500 font-bold">História Ibérica</p>
              </div>
            </div>
            {view === 'TEST' && <div className="bg-red-50 text-red-700 px-5 py-2 rounded-full font-mono font-bold border border-red-200 animate-pulse">{Math.floor(testTime/60)}:{(testTime%60).toString().padStart(2, '0')}</div>}
            <div className="flex gap-4">
              <button onClick={() => setShowGuide(true)} className="text-amber-600 hover:bg-amber-50 px-4 py-2 rounded-xl text-sm font-bold transition-all border border-amber-200">Guia 📖</button>
              <button onClick={() => setView('DASHBOARD')} className="text-stone-600 hover:text-amber-600 font-bold transition-colors">📊 Dashboard</button>
              <button onClick={() => setView('HOME')} className="bg-stone-100 hover:bg-stone-200 px-5 py-2 rounded-xl text-sm font-bold transition-all">Menu</button>
            </div>
          </header>

          <main className="animate-fade-in">
            {view === 'HOME' && (
              <div className="max-w-6xl mx-auto px-6 py-20 text-center">
                <h2 className="text-6xl sm:text-8xl font-serif font-bold text-stone-900 mb-8 leading-[0.9]">Primeiras Comunidades da <br/><span className="text-amber-600">Península Ibérica</span></h2>
                <p className="text-xl text-stone-500 max-w-2xl mx-auto mb-20 font-medium font-serif">Prepara-te com {QUESTIONS_DATA.length} desafios pedagógicos completos. Explora a vida dos caçadores-recoletores, dos agropastoris, e dos povos mediterrâneos.</p>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                  <button onClick={() => startMode('STUDY')} className="bg-white p-10 rounded-[2.5rem] border border-stone-200 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all text-left group">
                    <div className="text-5xl mb-6 group-hover:scale-110 transition-transform">📖</div>
                    <h3 className="text-2xl font-bold mb-3">Modo Estudo</h3>
                    <p className="text-stone-500 text-sm leading-relaxed">Navegação livre, dicas e correção de erros focado em dominar o conteúdo.</p>
                  </button>
                  <button onClick={() => startMode('TEST')} className="bg-white p-10 rounded-[2.5rem] border border-stone-200 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all text-left group">
                    <div className="text-5xl mb-6 group-hover:scale-110 transition-transform">⏱️</div>
                    <h3 className="text-2xl font-bold mb-3">Modo Teste</h3>
                    <p className="text-stone-500 text-sm leading-relaxed">Prova de fogo: 20 questões aleatórias sob pressão de tempo para avaliação.</p>
                  </button>
                  <button onClick={() => setView('CUSTOM_SETUP')} className="bg-white p-10 rounded-[2.5rem] border border-stone-200 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all text-left group">
                    <div className="text-5xl mb-6 group-hover:scale-110 transition-transform">🛠️</div>
                    <h3 className="text-2xl font-bold mb-3">Personalizado</h3>
                    <p className="text-stone-500 text-sm leading-relaxed">Escolhe temas específicos para treinar as tuas dificuldades.</p>
                  </button>
                  <button onClick={() => setView('DASHBOARD')} className="bg-white p-10 rounded-[2.5rem] border border-stone-200 shadow-sm hover:shadow-2xl hover:-translate-y-2 transition-all text-left group">
                    <div className="text-5xl mb-6 group-hover:scale-110 transition-transform">📊</div>
                    <h3 className="text-2xl font-bold mb-3">Dashboard</h3>
                    <p className="text-stone-500 text-sm leading-relaxed">Vê o teu progresso detalhado e conquistas acumuladas.</p>
                  </button>
                </div>
              </div>
            )}
            
            {view === 'CUSTOM_SETUP' && (
              <div className="max-w-4xl mx-auto px-6 py-16">
                <div className="bg-white p-12 rounded-[3rem] border border-stone-200 shadow-2xl">
                  <h2 className="text-4xl font-serif font-bold mb-10 text-stone-900">🛠️ Escolher Temas de Treino</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-12">
                    {TOPICS.map(topic => (
                      <label key={topic} className={`flex items-center gap-5 p-6 rounded-3xl border-2 cursor-pointer transition-all ${selectedTopics.includes(topic) ? 'border-amber-600 bg-amber-50 shadow-md' : 'border-stone-100 hover:border-amber-200 bg-stone-50'}`}>
                        <input type="checkbox" checked={selectedTopics.includes(topic)} onChange={e => e.target.checked ? setSelectedTopics([...selectedTopics, topic]) : setSelectedTopics(selectedTopics.filter(t => t !== topic))} className="w-6 h-6 accent-amber-600"/>
                        <span className="font-bold text-stone-800">{topic}</span>
                      </label>
                    ))}
                  </div>
                  <div className="flex gap-4">
                    <button onClick={() => setView('HOME')} className="flex-1 bg-stone-100 hover:bg-stone-200 py-5 rounded-2xl font-bold text-stone-600">Cancelar</button>
                    <button disabled={selectedTopics.length === 0} onClick={() => { setActiveQuestions(QUESTIONS_DATA.filter(q => selectedTopics.includes(q.topic)).sort(() => Math.random() - 0.5)); setView('CUSTOM_QUIZ'); }} className="flex-[2] bg-amber-600 hover:bg-amber-700 text-white py-5 rounded-2xl font-bold shadow-lg disabled:opacity-50">Iniciar Treino</button>
                  </div>
                </div>
              </div>
            )}

            {view === 'DASHBOARD' && (
              <div className="max-w-6xl mx-auto px-6 py-16">
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-10">
                  <div className="lg:col-span-1 space-y-10">
                    <div className="bg-amber-600 p-10 rounded-[3rem] text-white shadow-2xl relative overflow-hidden">
                      <div className="absolute top-0 right-0 p-4 text-white/10 text-9xl font-serif">⏳</div>
                      <p className="text-amber-100 font-bold uppercase tracking-widest text-xs mb-3">Pontuação Total</p>
                      <h3 className="text-7xl font-serif font-bold">{stats.totalScore}</h3>
                      <div className="mt-8 flex gap-6">
                        <div><p className="text-xs font-bold uppercase text-amber-200">Jogos</p><p className="text-2xl font-bold">{stats.gamesPlayed}</p></div>
                        <div className="w-px h-10 bg-white/20"></div>
                        <div><p className="text-xs font-bold uppercase text-amber-200">Questões</p><p className="text-2xl font-bold">{QUESTIONS_DATA.length}</p></div>
                      </div>
                    </div>
                    <div className="bg-white p-10 rounded-[3rem] border border-stone-200 shadow-sm">
                      <h4 className="font-bold text-stone-900 mb-8 flex items-center gap-3">🏆 Badges Conquistados</h4>
                      <div className="grid grid-cols-2 gap-6">
                        {BADGES_CONFIG.map(bc => <BadgeIcon key={bc.id} id={bc.id} earned={stats.badges.includes(bc.id)} />)}
                      </div>
                    </div>
                  </div>
                  <div className="lg:col-span-2 bg-white p-12 rounded-[3rem] border border-stone-200 shadow-sm h-full">
                    <h4 className="text-2xl font-serif font-bold text-stone-900 mb-10">Performance por Tema</h4>
                    <div className="space-y-8 text-stone-600">
                      {TOPICS.map(topic => {
                        const p = stats.topicPerformance[topic];
                        const correct = p ? p.correct : 0;
                        const total = p ? p.total : 0;
                        const incorrect = total - correct;
                        const hasData = total > 0;
                        const score = hasData ? Math.round((correct/total)*100) : 0;
                        
                        return (
                          <div key={topic} className="group">
                            <div className="flex justify-between items-end mb-3">
                              <div>
                                <span className="text-xs font-bold uppercase text-stone-500 group-hover:text-amber-600 transition-colors block mb-1">{topic}</span>
                                <div className="text-[10px] font-bold text-stone-400 bg-stone-100 px-3 py-1.5 rounded-full inline-block">
                                  {hasData ? (
                                    <span className="flex gap-2">
                                      <span className="text-green-600">✔ {correct}</span>
                                      <span className="text-stone-300">|</span>
                                      <span className="text-red-500">✖ {incorrect}</span>
                                    </span>
                                  ) : '0/0'}
                                </div>
                              </div>
                              <span className="text-2xl font-serif font-bold text-amber-600">{score}%</span>
                            </div>
                            <div className="w-full bg-stone-100 h-4 rounded-full overflow-hidden p-0.5 shadow-inner">
                              <div className="bg-amber-600 h-full rounded-full transition-all duration-1000 ease-out" style={{width: `${score}%`}}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {(['STUDY', 'TEST', 'CUSTOM_QUIZ'].includes(view)) && (
              <Quiz questions={activeQuestions} mode={view === 'TEST' ? 'test' : 'study'} onComplete={handleQuizComplete} />
            )}
          </main>
          
          <footer className="fixed bottom-0 left-0 right-0 p-4 flex flex-col items-center justify-end gap-3 pointer-events-none z-50">
            <div className="bg-white/90 backdrop-blur-xl px-10 py-4 rounded-[2rem] border border-stone-200 shadow-2xl pointer-events-auto flex items-center gap-10">
              <div className="flex items-center gap-3">
                <span className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">Global</span>
                <span className="font-serif font-bold text-2xl text-amber-700">{stats.totalScore}</span>
              </div>
              <div className="w-px h-8 bg-stone-200"></div>
              <div className="flex items-center gap-3">
                <span className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">Modo</span>
                <span className="font-serif font-bold text-2xl text-stone-800 uppercase">
                  {view === 'TEST' ? 'Teste' : (view === 'STUDY' ? 'Estudo' : (view === 'HOME' ? 'Menu' : 'Treino'))}
                </span>
              </div>
            </div>
            <p className="text-[10px] font-serif font-bold text-stone-400 tracking-wide text-center bg-white/50 px-3 py-1 rounded-full backdrop-blur-sm shadow-sm">
                Teodósio Faria ©2026 Guia de Estudo das Primeiras Comunidades da Península Ibérica
            </p>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
